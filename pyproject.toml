[project]
name = "echo-was"
version = "0.1.0"
description = "Team Echo 멀티 클라우드 관리 평면 API 서버"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "botocore>=1.43.123",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# 규칙 문서·확정 SPEC(해시로 고정)의 예시 코드는 포맷 대상이 아니다.
extend-exclude = [".claude", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
# 저장소의 alembic/ 폴더 때문에 alembic 패키지를 자기 코드로 잘못 분류하지 않게 한다.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 건너뛴 테스트의 이유(DB 미연결 등)를 결과 요약에 항상 보여 준다.
addopts = "-rs"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: 실제 PostgreSQL 이 필요한 테스트 (TEST_DATABASE_URL)"]

[dependency-groups]
dev = [
    "botocore-stubs>=1.43.123",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
