# 로컬 개발용 PostgreSQL. 계정 echo/echo 는 개발용 더미 값이며 실제 비밀값이 아니다.
# 통합 테스트 DB(echo_test)는 테스트 픽스처가 없으면 만든다.
name: echo-was

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo
    ports:
      # 기본 포트(5432)와 겹치지 않게 호스트 포트를 바꾼다.
      - "55432:5432"
    volumes:
      - echo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 배포 일꾼. API 와 같은 이미지(Dockerfile)를 쓰고 명령만 바꾼다. 기본 `up` 에는 들어가지 않는다:
  #   docker compose --profile worker up -d worker
  # 마이그레이션(alembic upgrade head)은 먼저 따로 실행해 둔다.
  worker:
    profiles: ["worker"]
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://echo:echo@db:5432/echo
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    stop_signal: SIGTERM

volumes:
  echo-db-data:
