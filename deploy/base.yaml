# 운영(해커톤 GCP 서울 echo-dev-gke, 네임스페이스 echo-was)에 적용하는 매니페스트. .github/workflows/deploy.yml 이 쓴다.
# 비밀값은 여기 없다: DB URL·GitHub App 비밀은 Secret Manager 에 있고 SecretSync 가 Secret echo-was-env 로 옮긴다.
# DB 비밀번호 Secret echo-was-db 와 네임스페이스는 손으로 만든다(deploy/README.md).
# 파드 신원(KSA)·비밀 연결. GSA 는 echo-infra control-plane.tf 가 만든다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: echo-was
  namespace: echo-was
  annotations: {iam.gke.io/gcp-service-account: echo-dev-echo-was@team-echo-final.iam.gserviceaccount.com}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: echo-was-secrets, namespace: echo-was}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/team-echo-final/secrets/echo-dev-echo-was-database-url/versions/latest"
        path: "database-url"
      - resourceName: "projects/team-echo-final/secrets/echo-dev-echo-was-github-app-private-key/versions/latest"
        path: "github-app-private-key"
      - resourceName: "projects/team-echo-final/secrets/echo-dev-echo-was-github-app-client-secret/versions/latest"
        path: "github-app-client-secret"
      # 고정 진입점 가중치 API 토큰. 진입점 VM 이 만든 비밀이고 읽기 권한은 echo-infra control-plane.tf.
      - resourceName: "projects/team-echo-final/secrets/echo-dev-entry-weights-token/versions/latest"
        path: "entrypoint-token"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata: {name: echo-was-env, namespace: echo-was}
spec:
  serviceAccountName: echo-was
  secretProviderClassName: echo-was-secrets
  secretObject:
    type: Opaque
    data:
      - {sourcePath: "database-url", targetKey: "DATABASE_URL"}
      - {sourcePath: "github-app-private-key", targetKey: "ECHO_SECRET_GITHUB_APP_PRIVATE_KEY"}
      - {sourcePath: "github-app-client-secret", targetKey: "ECHO_SECRET_GITHUB_APP_CLIENT_SECRET"}
      - {sourcePath: "entrypoint-token", targetKey: "ECHO_SECRET_ENTRYPOINT_TOKEN"}
---
# echo-was 네임스페이스 울타리: 같은 네임스페이스끼리와 GCP 부하 분산기(프록시·헬스체크 대역)만 들어올 수 있다.
# 고객 앱 네임스페이스의 파드는 echo-was API·DB 에 직접 붙지 못한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: echo-was}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-same-namespace, namespace: echo-was}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-gclb-to-api, namespace: echo-was}
spec:
  podSelector: {matchLabels: {app: echo-was-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 35.191.0.0/16}
        - ipBlock: {cidr: 130.211.0.0/22}
      ports: [{port: 8000, protocol: TCP}]
---
# PostgreSQL 17 (데모용, 클러스터 안, PD standard-rwo 10Gi). 비밀번호는 Secret echo-was-db 에서만 읽는다.
apiVersion: v1
kind: Service
metadata:
  name: echo-db
  namespace: echo-was
spec:
  clusterIP: None
  selector: {app: echo-db}
  ports: [{name: pg, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: echo-db
  namespace: echo-was
spec:
  serviceName: echo-db
  replicas: 1
  selector:
    matchLabels: {app: echo-db}
  template:
    metadata:
      labels: {app: echo-db}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_USER, value: echo}
            - {name: POSTGRES_DB, value: echo}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: echo-was-db, key: password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "echo", "-d", "echo"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests: {storage: 10Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-was-config
  namespace: echo-was
data:
  LOG_LEVEL: INFO
  PUBLIC_BASE_DOMAIN: echoport.uk
  EXECUTOR_MODE: fake
  HEALTH_CHECKER_MODE: fake
  # 트래픽 비율·대표 주소·지표는 고정 진입점(Envoy 가중치 API, 진입점 VM 내부 주소)을 부른다.
  ENTRYPOINT_EXECUTOR_MODE: http
  ENTRYPOINT_BASE_URL: http://10.60.0.6:8080
  ENTRYPOINT_TOKEN_REF: env:ECHO_SECRET_ENTRYPOINT_TOKEN
  # 시연 조직 echo-demo 의 환경 접속 비밀 자리 표시(실제 비밀 아님). 배포 실행기가 가짜(fake)인 동안
  # 환경 연결 확인은 비밀이 "있는지"만 본다. 실제 실행기(EXECUTOR_MODE=real)로 바꿀 때 지운다.
  ECHO_SECRET_ECHO_DEMO__FAKE_KUBECONFIG: fake-executor-placeholder
  SOURCE_CLIENT_MODE: github
  GITHUB_APP_ID: "5574944"
  GITHUB_APP_PRIVATE_KEY_REF: env:ECHO_SECRET_GITHUB_APP_PRIVATE_KEY
  GITHUB_APP_INSTALL_URL: https://github.com/apps/echoport-deploy/installations/new
  GITHUB_APP_CLIENT_ID: Iv23lipNlpKaIxNuvR17
  GITHUB_APP_CLIENT_SECRET_REF: env:ECHO_SECRET_GITHUB_APP_CLIENT_SECRET
  SESSION_COOKIE_NAME: __Host-echo_session
  FRONTEND_BASE_URL: https://app.echoport.uk
  LOGIN_ALLOWED_GITHUB_ORG: softbank-hackathon-2026-team-echo
  FRONTEND_ALLOWED_ORIGINS: https://app.echoport.uk
  GITHUB_OAUTH_REDIRECT_URI: https://api.echoport.uk/api/v1/auth/github/callback
---
apiVersion: v1
kind: Service
metadata:
  name: echo-was-api
  namespace: echo-was
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "echo-was-api"}'
spec:
  type: ClusterIP
  selector: {app: echo-was-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-was-api
  namespace: echo-was
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: echo-dev-echo-was
    ingress.gcp.kubernetes.io/pre-shared-cert: echo-dev-echo-was
    networking.gke.io/v1beta1.FrontendConfig: echo-was-api
spec:
  rules:
    - host: api.echoport.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-was-api
                port: {number: 80}
