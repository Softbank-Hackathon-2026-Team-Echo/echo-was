# 운영(해커톤 GCP 서울 echo-dev-gke, 네임스페이스 echo-was)에 적용하는 매니페스트. .github/workflows/deploy.yml 이 쓴다.
# 비밀값은 여기 없다: DB URL·GitHub App 비밀은 Secret Manager 에 있고 SecretSync 가 Secret echo-was-env 로 옮긴다.
# DB 비밀번호 Secret echo-was-db 와 네임스페이스는 손으로 만든다(deploy/README.md).
# 파드 신원(KSA)·비밀 연결. GSA 는 echo-infra control-plane.tf 가 만든다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: echo-was
  namespace: echo-was
  annotations: {iam.gke.io/gcp-service-account: echo-dev-echo-was@team-echo-final.iam.gserviceaccount.com}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: echo-was-secrets, namespace: echo-was}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/team-echo-final/secrets/echo-dev-echo-was-database-url/versions/latest"
        path: "database-url"
      - resourceName: "projects/team-echo-final/secrets/echo-dev-echo-was-github-app-private-key/versions/latest"
        path: "github-app-private-key"
      - resourceName: "projects/team-echo-final/secrets/echo-dev-echo-was-github-app-client-secret/versions/latest"
        path: "github-app-client-secret"
      # 고정 진입점 가중치 API 토큰. 진입점 VM 이 만든 비밀이고 읽기 권한은 echo-infra control-plane.tf.
      - resourceName: "projects/team-echo-final/secrets/echo-dev-entry-weights-token/versions/latest"
        path: "entrypoint-token"
      # 온프레 앱 주소 DNS 레코드용 Cloudflare API 토큰(echoport.uk 영역의 DNS 편집·영역 읽기만, API 서버 3-2 P8).
      - resourceName: "projects/team-echo-final/secrets/echo-dev-echo-was-cloudflare-dns-token/versions/latest"
        path: "cloudflare-dns-token"
      # 시연 조직 echo-demo 의 온프레 환경(k3s) 실행기 SA 토큰. echo-infra onprem/manifests/echo-executor.yaml 이 만든다.
      - resourceName: "projects/team-echo-final/secrets/echo-dev-echo-was-onprem-executor-token/versions/latest"
        path: "onprem-executor-token"
      # 데이터 확인(복제 지연) 읽기 전용 계정 echo_monitor 비밀번호(pg_monitor 만, A·B 같은 값). echo-infra replication/k8s/scripts/monitor-user.sh 가 만든다.
      - resourceName: "projects/team-echo-final/secrets/echo-dev-echo-was-pg-monitor-password/versions/latest"
        path: "data-sync-password"
      # 진입점 Prometheus basic auth 비밀번호(사용자 echo-otel, 지표 API 운영 2). 진입점 VM 이 쓰는 비밀이고
      # GSA 읽기 권한(이 비밀 하나에만)은 11/5 gcloud 로 손으로 줬다.
      - resourceName: "projects/team-echo-final/secrets/echo-dev-entry-prometheus-remote-write/versions/latest"
        path: "entrypoint-prometheus-password"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata: {name: echo-was-env, namespace: echo-was}
spec:
  serviceAccountName: echo-was
  secretProviderClassName: echo-was-secrets
  secretObject:
    type: Opaque
    data:
      - {sourcePath: "database-url", targetKey: "DATABASE_URL"}
      - {sourcePath: "github-app-private-key", targetKey: "ECHO_SECRET_GITHUB_APP_PRIVATE_KEY"}
      - {sourcePath: "github-app-client-secret", targetKey: "ECHO_SECRET_GITHUB_APP_CLIENT_SECRET"}
      - {sourcePath: "entrypoint-token", targetKey: "ECHO_SECRET_ENTRYPOINT_TOKEN"}
      - {sourcePath: "cloudflare-dns-token", targetKey: "ECHO_SECRET_CLOUDFLARE_DNS_TOKEN"}
      # SecretSync 키는 밑줄 두 개(조직 접두사 ECHO_SECRET_<조직>__)를 받지 않는다. 앱 이름으로는 app.yaml 의 env 가 옮긴다.
      - {sourcePath: "onprem-executor-token", targetKey: "ECHO_DEMO_ONPREM_EXECUTOR_TOKEN"}
      - {sourcePath: "data-sync-password", targetKey: "ECHO_SECRET_DATA_SYNC_PASSWORD"}
      - {sourcePath: "entrypoint-prometheus-password", targetKey: "ECHO_SECRET_ENTRYPOINT_PROMETHEUS_PASSWORD"}
---
# echo-was 네임스페이스 울타리: 같은 네임스페이스끼리와 GCP 부하 분산기(프록시·헬스체크 대역)만 들어올 수 있다.
# 고객 앱 네임스페이스의 파드는 echo-was API·DB 에 직접 붙지 못한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: echo-was}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-same-namespace, namespace: echo-was}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-gclb-to-api, namespace: echo-was}
spec:
  podSelector: {matchLabels: {app: echo-was-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 35.191.0.0/16}
        - ipBlock: {cidr: 130.211.0.0/22}
      ports: [{port: 8000, protocol: TCP}]
---
# PostgreSQL 17 (데모용, 클러스터 안, PD standard-rwo 10Gi). 비밀번호는 Secret echo-was-db 에서만 읽는다.
apiVersion: v1
kind: Service
metadata:
  name: echo-db
  namespace: echo-was
spec:
  clusterIP: None
  selector: {app: echo-db}
  ports: [{name: pg, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: echo-db
  namespace: echo-was
spec:
  serviceName: echo-db
  replicas: 1
  selector:
    matchLabels: {app: echo-db}
  template:
    metadata:
      labels: {app: echo-db}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - {name: POSTGRES_USER, value: echo}
            - {name: POSTGRES_DB, value: echo}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: echo-was-db, key: password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "echo", "-d", "echo"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests: {storage: 10Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-was-config
  namespace: echo-was
data:
  LOG_LEVEL: INFO
  PUBLIC_BASE_DOMAIN: echoport.uk
  # 실제 빌드(GitHub Actions customer-build.yml)·배포·내리기(EKS·GKE·온프레 k3s 직접 반영) 실행기(API 서버 3-2).
  EXECUTOR_MODE: real
  # 배포 뒤 환경별 주소(https)와 대표 주소로 헬스체크한다.
  HEALTH_CHECKER_MODE: http
  # 환경 등록·다시 확인이 실제 클러스터의 /version·노드 수를 읽는다(API 서버 12, 운영 파드 시험 4회 확인).
  # 되돌리려면 simulated(고정 값, simulated=true).
  ENVIRONMENT_ADAPTER_MODE: real
  # aws 환경이 config.roleArn 을 비우면 넘겨받는 역할(신뢰 = 이 파드 GSA 의 Google ID 토큰, EKS Access Entry).
  EXECUTOR_AWS_ROLE_ARN: arn:aws:iam::706878591119:role/echo-dev-executor
  # 이미지 정본(AR) → aws 환경에서 받을 ECR. customer-build.yml 이 두 곳에 같은 digest 로 올린다.
  IMAGE_REGISTRY_MIRRORS: asia-northeast3-docker.pkg.dev/team-echo-final/echo=706878591119.dkr.ecr.ap-northeast-1.amazonaws.com/echo
  # 트래픽 비율·대표 주소·지표는 고정 진입점(Envoy 가중치 API, 진입점 VM 내부 주소)을 부른다.
  ENTRYPOINT_EXECUTOR_MODE: http
  ENTRYPOINT_BASE_URL: http://10.60.0.6:8080
  ENTRYPOINT_TOKEN_REF: env:ECHO_SECRET_ENTRYPOINT_TOKEN
  # 서비스 대시보드 지표 API(운영 2)가 같은 진입점 VM 의 Prometheus 를 직접 읽는다(VPC 내부).
  # 진입점 Prometheus 는 basic auth 를 쓴다(11/5 인프라 9, 사용자는 기본 echo-otel). 비밀번호는 SecretSync 가
  # 옮긴 ECHO_SECRET_ENTRYPOINT_PROMETHEUS_PASSWORD 에서 읽는다. 지우면 인증 없이 읽어 401 → UNAVAILABLE.
  ENTRYPOINT_PROMETHEUS_URL: http://10.60.0.6:9090
  ENTRYPOINT_PROMETHEUS_BASIC_AUTH_PASSWORD_REF: env:ECHO_SECRET_ENTRYPOINT_PROMETHEUS_PASSWORD
  # 고객 앱 환경 변수·API 키 보관함(API 서버 10). GSA 는 echo-app- 접두어 비밀만 다룬다(조건부 secretmanager.admin,
  # 11/4 운영 파드에서 만들기·버전 추가·읽기 200, 접두어 밖 만들기 403 확인). 되돌리려면 fake(쓰기 API 409, 이미 쓴 {ns}-env 는 남음).
  APP_SECRET_STORE_MODE: gcp
  APP_SECRET_PROJECT_ID: team-echo-final
  # 이전 계획의 데이터 확인 단계가 출발 PostgreSQL 의 pg_stat_replication 에서 도착 구독의 지연을 읽는다(인프라 7, #51).
  # <환경 종류>=<출발로 쓸 때 붙을 주소>/<그 환경이 도착일 때의 구독 이름>. A(도쿄)→B(서울) 구독은 B 의 echo_sub, 역방향은 A 의 echo_sub_rev.
  # 매핑이 없는 환경(온프레 등)이 낀 이전은 데이터 확인에서 실패한다. 되돌리려면 fake.
  DATA_SYNC_CHECKER_MODE: postgres
  # gcp(B, 서울 DB)는 고객 클러스터 echo-dev-customer-gke 로 옮겼다(인프라 16 2단계, echo-infra#94) → 관제탑에서는 클러스터 안
  # DNS 대신 새 B 의 내부 LB(echo-data/echo-pg-internal, 출발지 = 관제탑 파드·노드 대역만)로 읽는다.
  DATA_SYNC_DATABASES: aws=echo-dev-pg-a-cb5bc23aab2d0c23.elb.ap-northeast-1.amazonaws.com:5432/echo_sub_rev,gcp=10.63.0.15:5432/echo_sub
  DATA_SYNC_USER: echo_monitor
  DATA_SYNC_PASSWORD_REF: env:ECHO_SECRET_DATA_SYNC_PASSWORD
  DATA_SYNC_SSL_MODE: require
  CUTOVER_RUNS_DATABASE: app
  CUTOVER_RESULTS_NOT_BEFORE: "2026-11-04T13:30:00Z"
  # DB 컷오버 Job 이미지(echo-infra replication/cutover-job, VAP 가 이 digest 만 허용). b13142d = B 가 다른 GKE 클러스터
  # (고객 클러스터)에 있어도 붙는 진입점. 실행기 모드(DB_CUTOVER_EXECUTOR_MODE)는 chore/db-cutover-enable PR 이 켠다.
  DB_CUTOVER_JOB_IMAGE: asia-northeast3-docker.pkg.dev/team-echo-final/echo/cutover@sha256:b4729702990c129871f074c4885594f7a28db1e2cb187299e1a7eecfdd9c86e6
  # 보안 게이트(보안·거버넌스 5, 지민 11/5 결정 D): 이전 승인·일꾼 실행 시작 때 필수 통제가 FAIL·UNKNOWN 이고
  # 유효한 기한부 예외가 없으면 409 SECURITY_GATE_BLOCKED. 되돌리려면 "false" PR(ConfigMap 만 바뀌니 병합 뒤 api·worker 재시작).
  SECURITY_GATE_ENABLED: "true"
  # DB 쓰기 전환 단계(API 서버 17): includeCutover=true 계획이 같은 클러스터 echo-ops 에 컷오버 Job 을 만든다.
  # 권한은 echo-infra replication/cutover-job Role echo-was-cutover-jobs, 결과 행은 위 DATA_SYNC_*·CUTOVER_RUNS_DATABASE 로 읽는다.
  # Job 이미지 DB_CUTOVER_JOB_IMAGE 는 #113 이 넣는다(이 PR 은 #113 병합 뒤에 병합).
  # 재난 긴급 이전 자동 포함(MIGRATION_DB_CUTOVER_ON_DISASTER)은 넣지 않는다(리허설 뒤 별도 결정).
  # 되돌리려면 이 줄을 지우고 재배포(기본 disabled, includeCutover=true 는 409). 이미 돌고 있는 Job 은 멈추지 않는다.
  DB_CUTOVER_EXECUTOR_MODE: kubernetes
  # 판정 범위 WAS 버전. C-IAM-2·C-AUD-1 의 증거·예외(wasVersion)가 이 값과 같아야 한다 — 비면 두 통제는 예외로도
  # 풀 수 없어 모든 이전이 막힌다. 값을 바꾸면 두 통제 예외를 새 값으로 다시 만든다.
  WAS_VERSION: "2026.11.05"
  # 패치 승인 때 반영 실행(APPLY_PATCH)을 만든다(API 서버 10-2, 지민 11/6 결정). 러너가 ECHO_APPLY_PATCH=on 으로
  # capabilities 에 APPLY_PATCH 를 낼 때만 가져간다. 되돌리려면 "false" PR(ConfigMap 만 바뀌니 병합 뒤 api 재시작).
  PATCH_APPLY_ENABLED: "true"
  # 시연 조직 echo-demo 의 aws·gcp 환경 secretRef 자리 표시(실제 비밀 아님). aws·gcp 실행기와 접속 확인
  # 어댑터는 워크로드 신원으로 붙어 이 값을 읽지 않는다. 환경 등록은 secretRef 가 필수이고 접속 확인
  # 서비스가 어댑터 호출 전에 비밀이 "있는지" 조회하므로 지우지 않는다(API 서버 12 결정).
  ECHO_SECRET_ECHO_DEMO__FAKE_KUBECONFIG: fake-executor-placeholder
  SOURCE_CLIENT_MODE: github
  GITHUB_APP_ID: "5574944"
  GITHUB_APP_PRIVATE_KEY_REF: env:ECHO_SECRET_GITHUB_APP_PRIVATE_KEY
  GITHUB_APP_INSTALL_URL: https://github.com/apps/echoport-deploy/installations/new
  GITHUB_APP_CLIENT_ID: Iv23lipNlpKaIxNuvR17
  GITHUB_APP_CLIENT_SECRET_REF: env:ECHO_SECRET_GITHUB_APP_CLIENT_SECRET
  # 온프레 앱 주소 DNS 레코드(실제 실행기에서만 쓴다). 영역 = echoport.uk.
  CLOUDFLARE_API_TOKEN_REF: env:ECHO_SECRET_CLOUDFLARE_DNS_TOKEN
  CLOUDFLARE_ZONE_ID: e1448a089e52eab3624a7de24d7495b4
  SESSION_COOKIE_NAME: __Host-echo_session
  FRONTEND_BASE_URL: https://app.echoport.uk
  LOGIN_ALLOWED_GITHUB_ORG: softbank-hackathon-2026-team-echo
  FRONTEND_ALLOWED_ORIGINS: https://app.echoport.uk
  GITHUB_OAUTH_REDIRECT_URI: https://api.echoport.uk/api/v1/auth/github/callback
---
apiVersion: v1
kind: Service
metadata:
  name: echo-was-api
  namespace: echo-was
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "echo-was-api"}'
spec:
  type: ClusterIP
  selector: {app: echo-was-api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-was-api
  namespace: echo-was
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: echo-dev-echo-was
    ingress.gcp.kubernetes.io/pre-shared-cert: echo-dev-echo-was
    networking.gke.io/v1beta1.FrontendConfig: echo-was-api
spec:
  rules:
    - host: api.echoport.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-was-api
                port: {number: 80}
